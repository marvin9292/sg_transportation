name: Publish HACS release

on:
  push:
    branches:
      - main
    paths:
      - ".github/RELEASE_NOTES.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import json
          with open("custom_components/sg_transportation/manifest.json", encoding="utf-8") as file:
              print(json.load(file)["version"])
          PY
          )"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 0
          fi

          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file ".github/RELEASE_NOTES.md"
